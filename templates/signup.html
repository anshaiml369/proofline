<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proofline · Sign up</title>
  {% include "_auth_style.html" %}
</head>
<body>
  <main class="card">
    <p class="eyebrow">Proofline</p>
    <h1>Create an account</h1>
    <p class="sub">For platform trust &amp; safety teams</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/signup">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}">
      <label for="password">Password <span class="hint">(at least 8 characters)</span></label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit">Sign up</button>
    </form>
    <p class="switch">Already have an account? <a href="/login">Log in</a></p>
  </main>
</body>
</html>
