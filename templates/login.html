<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proofline · Log in</title>
  {% include "_auth_style.html" %}
</head>
<body>
  <main class="card">
    <p class="eyebrow">Proofline</p>
    <h1>Log in</h1>
    <p class="sub">Dispute dashboard for platform teams</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="switch">No account? <a href="/signup">Sign up</a></p>
  </main>
</body>
</html>
