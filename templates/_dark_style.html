<style>
  :root {
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --bg: #0f172a; --card: #1e293b; --ink: #f8fafc; --muted: #94a3b8; --line: #334155; --hover: #334155;
    --green: #22c55e; --green-dark: #15803d; --amber: #eab308; --red: #ef4444;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.45; font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid #f8fafc; outline-offset: 2px; }
  main { max-width: 1280px; margin: 0 auto; padding: 32px 24px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  h1 { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .account { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
  .account .who { color: var(--muted); margin-right: 8px; }
  .account form { display: inline; }
  .nav {
    font-family: var(--font); font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none; background: transparent;
    border: 1px solid #475569; border-radius: 24px; padding: 0 16px; min-height: 44px; cursor: pointer; display: inline-flex; align-items: center;
  }
  .nav:hover { background: var(--hover); }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
  .pill { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pill.favor_rider { background: rgba(34,197,94,.15); color: #86efac; }
  .pill.inconclusive { background: rgba(234,179,8,.15); color: #fde047; }
  .pill.favor_customer { background: rgba(239,68,68,.15); color: #fca5a5; }
  .table-wrap { margin-top: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: clip; box-shadow: var(--shadow); }
  @media (min-width: 641px) and (max-width: 1100px) { .table-wrap { overflow-x: auto; } table { min-width: 960px; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; }
  th {
    position: sticky; top: 0; z-index: 1; background: var(--card); text-align: left; font-size: 13px; color: var(--muted);
    font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 16px; border-bottom: 1px solid var(--line);
  }
  td { height: 56px; padding: 8px 16px; font-size: 15px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr.row:hover > td { background: var(--hover); }
  .ghost {
    font-family: var(--font); font-size: 14px; font-weight: 600; padding: 0 16px; min-height: 40px; border-radius: 24px;
    border: 1px solid #475569; background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .ghost:hover { background: var(--hover); }
  .ghost[aria-expanded="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  tr.detail { display: none; }
  tr.detail.open { display: table-row; }
  tr.detail > td { height: auto; padding: 16px; background: var(--bg); }
  /* Expanded evidence uses the light card style */
  .lcard { background: #fff; color: #0f172a; border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
  .lcard h3 { font-size: 13px; color: #64748b; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-bottom: 8px; }
  .lcard .quote { font-size: 16px; line-height: 1.5; background: #f1f5f9; border-radius: 12px; padding: 16px; }
  .lcard .orig { font-size: 14px; color: #64748b; margin-top: 8px; }
  .lcard .why { margin-top: 16px; font-size: 15px; }
  .strength { display: flex; align-items: center; gap: 8px; }
  .strength strong { font-size: 16px; font-weight: 600; min-width: 28px; }
  .bar { width: 64px; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: 999px; }
  .favor_rider .bar span, .bar.favor_rider span { background: var(--green); }
  .inconclusive .bar span, .bar.inconclusive span { background: var(--amber); }
  .favor_customer .bar span, .bar.favor_customer span { background: var(--red); }
  footer { margin-top: 24px; font-size: 14px; color: var(--muted); max-width: 900px; }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); }
  /* Phones: each row becomes a stacked card */
  @media (max-width: 640px) {
    main { padding: 24px 16px 48px; }
    .table-wrap { background: transparent; border: none; box-shadow: none; overflow: visible; }
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tr.row { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px 16px; margin-top: 16px; }
    tr.row > td { display: flex; justify-content: flex-end; align-items: center; gap: 8px; height: auto; min-height: 44px; padding: 8px 0; text-align: right; }
    tr.row > td:last-child { border-bottom: none; }
    tr.row > td[data-label]::before { content: attr(data-label); color: var(--muted); font-family: var(--font); font-size: 13px; font-weight: 400; text-align: left; margin-right: auto; padding-right: 8px; }
    tr.row > td.action { justify-content: stretch; }
    tr.row > td.action .ghost { width: 100%; min-height: 44px; }
    tr.detail.open { display: block; }
    tr.detail > td { padding: 8px 0 0; background: transparent; border: none; }
    .lcard { padding: 16px; }
  }
</style>
